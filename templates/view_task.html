<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='view_task.css') }}">
    <script src="{{ url_for('static', filename='view_task.js') }}" defer></script>
</head>

<body class="gallery2">

    <header class="header">

    <h2 class="logo">Task Manager</h2>

    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/create">Create Task</a>
        <a href="/about">About</a>
    </nav>

</header>

  <div class="container2">
    <a href="/create" class="new-task">
    + Add New Task
</a>
    <div class="view-task">
        <h1>View Tasks</h1>
        <div class="actions">
            <button class="select-btn" type="button">
                Select  All ▼
            </button>
            <button class="delete-all-btn">
                🗑 Delete
            </button>
        </div>
    </div>
    <div class="search-container">
       <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search tasks...">
    </div>
    <div class="status-tabs">
       <button id="allBtn" class="status-tab active">All</button>
       <button id="pendingBtn" class="status-tab">Pending</button>
       <button id="completedBtn" class="status-tab">Completed</button>
    </div>
    <div class="filter-tabs">
          <span>Filter by :</span>
          <select>
             <option value ="" selected disabled>Status</option>
             <option>Pending</option>
             <option>Completed</option>
          </select>
          
          <select>
             <option value ="" selected disabled>All Categories</option>
             <option>School</option>
             <option>Work</option>
             <option>Shopping</option>
             <option>Health</option>
             <option>Birthday</option>
             <option>Others</option>
          </select>

          <select>
             <option value ="" selected disabled>All Priorities</option>
             <option>High</option>
             <option>Medium</option>
             <option>Low</option>
          </select>
        </div>
        
      


         <div class="task-container">

{% for task in tasks %}

<div class="task-card">

    <h3>{{ task["title"] }}</h3>

    <hr>

    <p>{{ task["description"] }}</p>

    <div class="task-details">

    <div class="detail-row">
        <strong>Category</strong>
        <span>{{ task["category"] }}</span>
    </div>

    <div class="detail-row">
        <strong>Priority</strong>
        <span class="priority">{{ task["priority"] }}</span>
    </div>

    <div class="detail-row">
        <strong>Due Date</strong>
        <span>{{ task["due_date"] }}</span>
    </div>

</div>

    <form action="{{ url_for('complete_task', id=task['id']) }}" method="POST">
        <input
            type="checkbox"
            onchange="this.form.submit()"
            {% if task["status"] == "Completed" %}checked{% endif %}>

        <span class="status">
    {{ task["status"] }}
</span>
    </form>

    <div class="task-actions">

        <button 
            type="button"
            class="edit-btn"
            onclick="editTask({{ task['id'] }})">
            ✏ Edit
        </button>

        <button
            type="button"  
            class="delete-btn"
            onclick="deleteTask({{ task['id'] }})">
            🗑 Delete
        </button>

    </div>

</div>

{% endfor %}

</div>

      </div>

      </div>

</div>



<div id="editModal" class="modal">

    <div class="modal-content">

        <h2>Edit Task</h2>

        <input type="hidden" id="editId">

        <input type="text" id="editTitle" placeholder="Title">

        <textarea id="editDescription" placeholder="Description"></textarea>

        <select id="editCategory">
            <option>Work</option>
            <option>School</option>
            <option>Shopping</option>
            <option>Health</option>
            <option>Birthday</option>
            <option>Other</option>
        </select>

        <select id="editPriority">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>

        <input type="datetime-local" id="editDueDate">

        <div class="buttons">
            <button type="button" onclick="saveTask()">Save Changes</button>
            <button type="button" onclick="closeModal()">Cancel</button>
        </div>

    </div>
</div>


     
</body>
</html>
