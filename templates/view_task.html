<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COS Group 5 project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='view_task.css') }}">
    <script src="{{ url_for('static', filename='view_task.js') }}" defer></script>
</head>
<body class="gallery2">
  <div class="container2">
    <a href="/create" class="new">
    <div class="new-task">
       + Add new task
    </div>
    </a>
    <div class="view-task">
        <h1>View Tasks</h1>
        <div class="actions">
            <button class="select-btn">
                Select  All ▼
            </button>
            <button class="delete-btn">
                🗑 Delete
            </button>
        </div>
    </div>
    <div class="search-container">
       <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search tasks...">
    </div>
    <div class="status-tabs">
       <button id="allBtn" class="status-tab active">All</button>
       <button id="pendingBtn" class="status-tab">Pending</button>
       <button id="completedBtn" class="status-tab">Completed</button>
    </div>
    <div class="filter-tabs">
          <span>Filter by :</span>
          <select>
             <option value ="" selected disabled>Status</option>
             <option>Pending</option>
             <option>Completed</option>
          </select>
          
          <select>
             <option value ="" selected disabled>All Categories</option>
             <option>School</option>
             <option>Work</option>
             <option>Shopping</option>
             <option>Health</option>
             <option>Birthday</option>
             <option>Others</option>
          </select>

          <select>
             <option value ="" selected disabled>All Priorities</option>
             <option>High</option>
             <option>Medium</option>
             <option>Low</option>
          </select>
        </div>
        
      <div class="tasks-container">

         <table class="tasks-table" border="1">
            <thead class="table-head">
               <tr>
                  <th>Title</th>
                  <th>Description</th>
                  <th>Category</th>
                  <th>Priority</th>
                  <th>Due date</th>
                  <th>Status</th>
               </tr>
            </thead>

            

         <tbody class="table-body">
      
         {% for task in tasks %}

         <tr class="task-row">

            <td>{{ task["title"] }}</td>
            <td>{{ task["description"] }}</td>
            <td>Category: {{ task["category"] }}</td>
            <td>Priority: {{ task["priority"] }}</td>
            <td>Due Date: {{ task["due_date"] }}</td>

         
            <td>
         <div class="task-actions">
            
            <form action="{{ url_for('complete_task', id=task['id']) }}" method="POST">
               <input
                  type="checkbox"
                  onchange="this.form.submit()"
                  {% if task["status"] == "Completed" %}checked{% endif %}>
               <label>
                  {{ task["status"] }}
               </label>
            </form>
            </td>
               <td>
               <button class="edit-btn" onclick="editTask({{ task['id'] }})">
                  Edit
               </button>
               </td>
               <td>
               <button class="delete-btn" onclick="deleteTask({{ task['id'] }})">
                  Delete
               </button>
               </td>
               </tr>
               {% endfor %}
            
         </tbody>
         </table>
      </div>

      </div>

</div>


<div id="editModal" class="modal">

    <div class="modal-content">

        <h2>Edit Task</h2>

        <input type="hidden" id="editId">

        <input type="text" id="editTitle" placeholder="Title">

        <textarea id="editDescription" placeholder="Description"></textarea>

        <select id="editCategory">
            <option>Work</option>
            <option>School</option>
            <option>Shopping</option>
            <option>Health</option>
            <option>Birthday</option>
            <option>Other</option>
        </select>

        <select id="editPriority">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>

        <input type="datetime-local" id="editDueDate">

        <div class="buttons">
            <button onclick="saveTask()">Save Changes</button>
            <button onclick="closeModal()">Cancel</button>
        </div>

    </div>

</div>
     
</body>
</html>
